services:
  database:
    image: postgres:15
    environment:
      - POSTGRES_USER=documenso
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=documenso
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U documenso']
      interval: 1s
      timeout: 5s
      retries: 5
    ports:
      - 15432:5432
    volumes:
      - ./data:/var/lib/postgresql/data

volumes:
  documenso-data:
    driver: local
