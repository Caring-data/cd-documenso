name: documenso

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '5001:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:rw
      - /etc/Certs:/etc/Certs:ro

  app_blue:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    expose:
      - '5000'
    env_file:
      - ../.env
    environment:
      - PORT=5000
    volumes:
      - /opt/documenso/cert.p12:/opt/documenso/cert.p12:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  app_green:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    expose:
      - '5000'
    env_file:
      - ../.env
    environment:
      - PORT=5000
    volumes:
      - /opt/documenso/cert.p12:/opt/documenso/cert.p12:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
